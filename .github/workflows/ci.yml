name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gni
          POSTGRES_PASSWORD: gni_test_password
          POSTGRES_DB: gni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gni -d gni_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GNI_TEST_DATABASE_URL: postgresql://gni:gni_test_password@localhost:5432/gni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
