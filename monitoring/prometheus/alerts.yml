groups:
  - name: global-news-intelligence-runtime
    interval: 30s
    rules:
      - alert: GNIWorkerTargetDown
        expr: up{job="gni-runtime"} == 0
        for: 2m
        labels:
          severity: critical
          service: global-news-intelligence
        annotations:
          summary: "GNI runtime metrics target is down"
          description: "Prometheus cannot scrape the GNI runtime target for at least 2 minutes. Check the runtime process, network policy, and private metrics endpoint."

      - alert: GNIWorkerLoopErrors
        expr: sum by (instance, error_type) (increase(gni_worker_errors_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
          service: global-news-intelligence
        annotations:
          summary: "GNI worker loop errors detected"
          description: "One or more worker supervisor errors occurred in the last 5 minutes. Inspect sanitized application logs and audit events."

      - alert: GNIAuditWritesFailing
        expr: sum(increase(gni_audit_write_failures_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: global-news-intelligence
        annotations:
          summary: "GNI audit writes are failing"
          description: "Audit sink writes failed in the last 5 minutes. Check database connectivity, permissions, and audit storage capacity."

      - alert: GNIMetricsWritesFailing
        expr: sum(increase(gni_metrics_write_failures_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
          service: global-news-intelligence
        annotations:
          summary: "GNI metrics are being dropped"
          description: "The in-process metrics registry rejected metric updates. Check cardinality limits and label values."

      - alert: GNIJobProcessingP95High
        expr: histogram_quantile(0.95, sum by (le, agent) (rate(gni_job_processing_duration_seconds_bucket[10m]))) > 30
        for: 10m
        labels:
          severity: warning
          service: global-news-intelligence
        annotations:
          summary: "GNI job processing p95 is above 30 seconds"
          description: "At least one agent has sustained p95 processing latency above the provisional 30-second threshold. Tune this threshold after observing real workloads."

      - alert: GNIJobFailuresDetected
        expr: sum(increase(gni_jobs_processed_total{status="failed"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
          service: global-news-intelligence
        annotations:
          summary: "GNI jobs failed"
          description: "At least one job was recorded with failed status in the last 10 minutes. Inspect job records and dead-letter handling; this metric is process-local."

      - alert: GNIWorkflowFailuresDetected
        expr: sum(increase(gni_workflow_runs_total{status="failed"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
          service: global-news-intelligence
        annotations:
          summary: "GNI workflow runs failed"
          description: "A workflow scheduler operation observed a failed workflow. Inspect workflow run and step records."

      - alert: GNIOutboxRetriesIncreasing
        expr: sum(increase(gni_outbox_events_total{action="scheduled_retry"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
          service: global-news-intelligence
        annotations:
          summary: "GNI outbox publication retries detected"
          description: "Queue publication failed and an outbox event was rescheduled. Check queue/database availability."

      - alert: GNIOutboxDeadLettersCreated
        expr: sum(increase(gni_outbox_events_total{action=~"dead_lettered.*"}[10m])) > 0
        for: 1m
        labels:
          severity: critical
          service: global-news-intelligence
        annotations:
          summary: "GNI outbox events entered dead-letter state"
          description: "An outbox event could not be published permanently or referenced a missing job. Operator review is required."

      - alert: GNIDeadLetterCreated
        expr: sum(increase(gni_dead_letter_events_total{action="created"}[10m])) > 0
        for: 1m
        labels:
          severity: critical
          service: global-news-intelligence
        annotations:
          summary: "GNI queue dead-letter created"
          description: "A queue job entered the dead-letter store. Review the failure reason and replay only after approval."

      - alert: GNIQueueReserveEmpty
        expr: sum(rate(gni_queue_operations_total{action="reserve",result="empty"}[10m])) > 0
          and sum(gni_workers_running) > 0
          and sum(rate(gni_queue_operations_total{action="reserve",result="reserved"}[10m])) == 0
        for: 15m
        labels:
          severity: info
          service: global-news-intelligence
        annotations:
          summary: "GNI workers are polling an empty queue"
          description: "Workers have been running but no queue reservations succeeded for 15 minutes. This may be normal during quiet periods; review only if work is expected."
