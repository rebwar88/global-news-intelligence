global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: global-news-intelligence

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: gni-runtime
    scrape_interval: 15s
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/gni-metrics-token
    static_configs:
      - targets:
          - host.docker.internal:9108
