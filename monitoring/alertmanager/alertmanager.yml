global:
  resolve_timeout: 5m

route:
  receiver: drop-until-notification-channel-configured
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Deliberately no external receiver is configured yet.
  # Add an approved email, Telegram relay, or webhook before production use.
  - name: drop-until-notification-channel-configured
